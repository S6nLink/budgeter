<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>競馬展開予想プレディクトボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .board-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
    .badge-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.25);
    }
    .fast-finish-glow {
      box-shadow: 0 0 12px 2px #ef4444, inset 0 0 4px #fef08a;
      border-color: #ef4444 !important;
    }
    /* 選択中リングアニメーション */
    .selected-ring {
      outline: 4px solid #f59e0b;
      outline-offset: 2px;
      transform: scale(1.15);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- ヘッダー / コントロールバー -->
  <header class="bg-slate-800 border-b border-slate-700 p-3 shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🏇</span>
        <h1 class="text-lg font-bold tracking-wide text-amber-400">競馬展開予想プレディクトボード</h1>
      </div>

      <div class="flex flex-wrap items-center gap-2 text-sm">
        <!-- 頭数選択 -->
        <div class="flex items-center space-x-1 bg-slate-700 rounded px-2 py-1">
          <label for="horse-count" class="text-slate-300 font-medium">頭数:</label>
          <select id="horse-count" class="bg-slate-800 text-amber-400 font-bold rounded px-2 py-0.5 border border-slate-600 focus:outline-none">
            <option value="18" selected>18頭</option>
            <option value="17">17頭</option>
            <option value="16">16頭</option>
            <option value="15">15頭</option>
            <option value="14">14頭</option>
            <option value="13">13頭</option>
            <option value="12">12頭</option>
            <option value="10">10頭</option>
            <option value="8">8頭</option>
          </select>
        </div>

        <!-- アクションボタン -->
        <button id="btn-sync" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1 rounded transition shadow flex items-center gap-1">
          <span>➔</span> S➔4C位置コピー
        </button>
        <button id="btn-preset-high" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2 py-1 rounded text-xs transition">
          ハイペース展開
        </button>
        <button id="btn-preset-slow" class="bg-teal-700 hover:bg-teal-600 text-white px-2 py-1 rounded text-xs transition">
          スローペース展開
        </button>
        <button id="btn-reset" class="bg-rose-700 hover:bg-rose-600 text-white font-medium px-3 py-1 rounded transition">
          リセット
        </button>
      </div>
    </div>
  </header>

  <!-- ガイドメッセージ -->
  <div id="guide-msg" class="bg-amber-500/20 text-amber-300 text-xs text-center py-1.5 px-3 border-b border-amber-500/30 font-medium">
    💡 馬番をタップで選択 ➔ 配置したいボード上の場所をタップしてください
  </div>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex flex-col gap-4">
    
    <!-- 2画面展開ボード（左右・上下レイアウト） -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1">
      
      <!-- ボード 1: スタート直後 -->
      <section class="bg-slate-800/80 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow-lg">
        <div class="bg-slate-700/80 px-4 py-2 flex items-center justify-between border-b border-slate-600">
          <h2 class="font-bold text-emerald-400 flex items-center gap-2">
            <span>🏁</span> スタート直後の位置取り
          </h2>
          <span class="text-xs text-slate-400">右方向へ進行 ▶</span>
        </div>

        <!-- 予想フィールド -->
        <div id="board-start" data-board-type="start" class="relative flex-1 min-h-[340px] bg-emerald-950/40 board-grid overflow-hidden border-2 border-emerald-900/50 m-2 rounded-lg cursor-pointer">
          
          <div class="absolute left-1 top-2 text-xs font-bold text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700 pointer-events-none z-0">
            イン (内) ▲
          </div>
          <div class="absolute left-1 bottom-2 text-xs font-bold text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700 pointer-events-none z-0">
            アウト (外) ▼
          </div>

          <div class="absolute inset-0 grid grid-cols-4 pointer-events-none z-0">
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">追込</span>
            </div>
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">差し</span>
            </div>
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">先行</span>
            </div>
            <div class="flex flex-col items-center justify-center bg-emerald-900/10">
              <span class="text-emerald-500/40 font-black text-xl sm:text-2xl tracking-widest">逃げ</span>
            </div>
          </div>

          <div class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-600/30 text-4xl font-bold pointer-events-none z-0">
            ▶▶
          </div>
        </div>
      </section>

      <!-- ボード 2: 第4コーナー通過後 -->
      <section class="bg-slate-800/80 rounded-xl border border-slate-700 flex flex-col overflow-hidden shadow-lg">
        <div class="bg-slate-700/80 px-4 py-2 flex items-center justify-between border-b border-slate-600">
          <h2 class="font-bold text-amber-400 flex items-center gap-2">
            <span>↩️</span> 第4コーナー通過後の位置取り
          </h2>
          <span class="text-xs text-slate-400">右方向へ進行 ▶</span>
        </div>

        <!-- 予想フィールド -->
        <div id="board-corner4" data-board-type="corner4" class="relative flex-1 min-h-[340px] bg-emerald-950/40 board-grid overflow-hidden border-2 border-emerald-900/50 m-2 rounded-lg cursor-pointer">
          
          <div class="absolute left-1 top-2 text-xs font-bold text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700 pointer-events-none z-0">
            イン (内) ▲
          </div>
          <div class="absolute left-1 bottom-2 text-xs font-bold text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-700 pointer-events-none z-0">
            アウト (外) ▼
          </div>

          <div class="absolute inset-0 grid grid-cols-4 pointer-events-none z-0">
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">追込</span>
            </div>
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">差し</span>
            </div>
            <div class="border-r border-dashed border-slate-700/50 flex flex-col items-center justify-center">
              <span class="text-slate-500/40 font-black text-xl sm:text-2xl tracking-widest">先行</span>
            </div>
            <div class="flex flex-col items-center justify-center bg-emerald-900/10">
              <span class="text-emerald-500/40 font-black text-xl sm:text-2xl tracking-widest">逃げ</span>
            </div>
          </div>

          <div class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-600/30 text-4xl font-bold pointer-events-none z-0">
            ▶▶
          </div>
        </div>
      </section>

    </div>

    <!-- 馬番出走パレット -->
    <section class="bg-slate-800 rounded-xl border border-slate-700 p-3 shadow-lg sticky bottom-2 z-20">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-sm text-slate-300 flex items-center gap-2">
          <span>🐴</span> 馬番パレット 
          <span id="selected-info" class="text-xs font-normal text-amber-400">（タップで選択してください）</span>
        </h3>
      </div>
      <!-- 馬番並び -->
      <div id="horse-pool" class="flex flex-wrap gap-2 justify-center sm:justify-start min-h-[56px] items-center p-2 bg-slate-900/50 rounded-lg border border-slate-700/60">
      </div>
    </section>

  </main>

  <script>
    // JRA標準 枠色マスター定義
    function getWakuColor(num, total = 18) {
      if (total <= 8) {
        const colors = [
          { bg: '#ffffff', text: '#000000', border: '#9ca3af' },
          { bg: '#111827', text: '#ffffff', border: '#374151' },
          { bg: '#ef4444', text: '#ffffff', border: '#dc2626' },
          { bg: '#3b82f6', text: '#ffffff', border: '#2563eb' },
          { bg: '#eab308', text: '#000000', border: '#ca8a04' },
          { bg: '#22c55e', text: '#ffffff', border: '#16a34a' },
          { bg: '#f97316', text: '#ffffff', border: '#ea580c' },
          { bg: '#ec4899', text: '#ffffff', border: '#db2777' }
        ];
        return colors[num - 1] || colors[0];
      }

      let waku = 1;
      if (num <= 2) waku = 1;
      else if (num <= 4) waku = 2;
      else if (num <= 6) waku = 3;
      else if (num <= 8) waku = 4;
      else if (num <= 10) waku = 5;
      else if (num <= 12) waku = 6;
      else if (num <= 15) waku = 7;
      else waku = 8;

      const wakuColors = {
        1: { bg: '#ffffff', text: '#000000', border: '#9ca3af' },
        2: { bg: '#111827', text: '#ffffff', border: '#374151' },
        3: { bg: '#ef4444', text: '#ffffff', border: '#dc2626' },
        4: { bg: '#3b82f6', text: '#ffffff', border: '#2563eb' },
        5: { bg: '#eab308', text: '#000000', border: '#ca8a04' },
        6: { bg: '#22c55e', text: '#ffffff', border: '#16a34a' },
        7: { bg: '#f97316', text: '#ffffff', border: '#ea580c' },
        8: { bg: '#ec4899', text: '#ffffff', border: '#db2777' }
      };

      return wakuColors[waku];
    }

    // アプリ状態管理
    const state = {
      totalHorses: 18,
      selectedHorse: null, // 現在タップ選択中の馬番 (1~18)
      selectedFromBoard: null, // ボード上から選択した場合 { boardType, num }
      fastFinishMap: {},
      positions: {
        start: {},
        corner4: {}
      }
    };

    // DOM要素
    const horsePoolEl = document.getElementById('horse-pool');
    const boardStartEl = document.getElementById('board-start');
    const boardCorner4El = document.getElementById('board-corner4');
    const horseCountSelect = document.getElementById('horse-count');
    const selectedInfoEl = document.getElementById('selected-info');
    const guideMsgEl = document.getElementById('guide-msg');

    function initApp() {
      state.totalHorses = parseInt(horseCountSelect.value, 10);
      state.selectedHorse = null;
      state.selectedFromBoard = null;
      updateGuideText();
      renderPool();
      renderBoard('start');
      renderBoard('corner4');
    }

    function updateGuideText() {
      if (state.selectedHorse) {
        selectedInfoEl.innerText = `（${state.selectedHorse}番 選択中 ➔ 配置場所をタップ）`;
        guideMsgEl.innerText = `💡 [${state.selectedHorse}番] を選択中！ボード上の配置したい場所をタップしてください`;
      } else {
        selectedInfoEl.innerText = `（タップで選択してください）`;
        guideMsgEl.innerText = `💡 馬番をタップで選択 ➔ 配置したいボード上の場所をタップしてください`;
      }
    }

    // パレット描画
    function renderPool() {
      horsePoolEl.innerHTML = '';
      for (let i = 1; i <= state.totalHorses; i++) {
        const isPlacedStart = !!state.positions.start[i];
        const isPlacedCorner4 = !!state.positions.corner4[i];
        
        // 両方のボードに配置されていたらパレットからは非表示
        if (isPlacedStart && isPlacedCorner4) continue;

        const badgeWrapper = createPoolBadge(i);
        horsePoolEl.appendChild(badgeWrapper);
      }
    }

    // パレット用バッジ作成
    function createPoolBadge(num) {
      const color = getWakuColor(num, state.totalHorses);
      const isFast = !!state.fastFinishMap[num];
      const isSelected = state.selectedHorse === num;

      const container = document.createElement('div');
      container.className = 'relative flex flex-col items-center';

      // 上がり（🔥）ボタン
      const fireBtn = document.createElement('button');
      fireBtn.className = `text-[10px] px-1 py-0.2 rounded font-bold mb-1 transition-all ${
        isFast ? 'bg-red-600 text-white shadow-sm shadow-red-500' : 'bg-slate-700 text-slate-400 hover:text-white'
      }`;
      fireBtn.innerHTML = isFast ? '🔥上がり' : '🔥';
      fireBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFastFinish(num);
      };

      // 馬番バッジ本体
      const badge = document.createElement('div');
      badge.className = `w-10 h-10 rounded-full flex items-center justify-center font-black text-base badge-shadow border-2 transition-transform cursor-pointer ${
        isFast ? 'fast-finish-glow' : ''
      } ${isSelected ? 'selected-ring' : ''}`;
      badge.style.backgroundColor = color.bg;
      badge.style.color = color.text;
      badge.style.borderColor = isFast ? '#ef4444' : color.border;
      badge.innerText = num;

      // タップで選択/選択解除
      badge.onclick = (e) => {
        e.stopPropagation();
        if (state.selectedHorse === num) {
          state.selectedHorse = null;
        } else {
          state.selectedHorse = num;
          state.selectedFromBoard = null;
        }
        updateGuideText();
        renderPool();
        renderBoard('start');
        renderBoard('corner4');
      };

      container.appendChild(fireBtn);
      container.appendChild(badge);
      return container;
    }

    function toggleFastFinish(num) {
      state.fastFinishMap[num] = !state.fastFinishMap[num];
      renderPool();
      renderBoard('start');
      renderBoard('corner4');
    }

    // ボード描画
    function renderBoard(boardType) {
      const boardEl = boardType === 'start' ? boardStartEl : boardCorner4El;
      
      const oldBadges = boardEl.querySelectorAll('.board-horse-badge');
      oldBadges.forEach(el => el.remove());

      const boardPositions = state.positions[boardType];

      Object.keys(boardPositions).forEach(numStr => {
        const num = parseInt(numStr, 10);
        const pos = boardPositions[num];
        const color = getWakuColor(num, state.totalHorses);
        const isFast = !!state.fastFinishMap[num];
        const isSelected = state.selectedHorse === num;

        const badge = document.createElement('div');
        badge.className = `board-horse-badge absolute w-10 h-10 rounded-full flex items-center justify-center font-black text-sm sm:text-base badge-shadow border-2 cursor-pointer z-10 transition-transform ${
          isFast ? 'fast-finish-glow' : ''
        } ${isSelected ? 'selected-ring' : ''}`;
        badge.style.backgroundColor = color.bg;
        badge.style.color = color.text;
        badge.style.borderColor = isFast ? '#ef4444' : color.border;
        badge.style.left = `${pos.x}%`;
        badge.style.top = `${pos.y}%`;
        badge.style.transform = 'translate(-50%, -50%)';

        badge.innerHTML = isFast ? `${num}<span class="absolute -top-2 -right-1 text-xs">🔥</span>` : num;

        // ボード上のコマのタップイベント
        badge.onclick = (e) => {
          e.stopPropagation();
          // すでに選択中のコマをもう一度タップした場合は回収（パレットへ返す）
          if (state.selectedHorse === num) {
            delete state.positions[boardType][num];
            state.selectedHorse = null;
          } else {
            // タップで選択
            state.selectedHorse = num;
            state.selectedFromBoard = { boardType, num };
          }
          updateGuideText();
          renderPool();
          renderBoard('start');
          renderBoard('corner4');
        };

        boardEl.appendChild(badge);
      });
    }

    // ボード領域タップで選択中の馬番をその位置に配置
    [boardStartEl, boardCorner4El].forEach(boardEl => {
      boardEl.onclick = (e) => {
        // コマ自体のタップは除く
        if (e.target.closest('.board-horse-badge')) return;

        if (state.selectedHorse) {
          const num = state.selectedHorse;
          const rect = boardEl.getBoundingClientRect();
          
          // タップ位置のパーセンテージ計算
          const xPercent = Math.max(5, Math.min(95, ((e.clientX - rect.left) / rect.width) * 100));
          const yPercent = Math.max(5, Math.min(95, ((e.clientY - rect.top) / rect.height) * 100));

          const boardType = boardEl.dataset.boardType;

          // 前に配置されていた場所があれば削除（再配置の場合）
          if (state.selectedFromBoard && state.selectedFromBoard.boardType === boardType) {
            delete state.positions[boardType][num];
          }

          state.positions[boardType][num] = { x: xPercent, y: yPercent };
          state.selectedHorse = null;
          state.selectedFromBoard = null;

          updateGuideText();
          renderPool();
          renderBoard('start');
          renderBoard('corner4');
        }
      };
    });

    // コントロール定義
    horseCountSelect.addEventListener('change', initApp);

    document.getElementById('btn-sync').addEventListener('click', () => {
      state.positions.corner4 = JSON.parse(JSON.stringify(state.positions.start));
      renderPool();
      renderBoard('corner4');
    });

    document.getElementById('btn-preset-high').addEventListener('click', () => applyPreset('high'));
    document.getElementById('btn-preset-slow').addEventListener('click', () => applyPreset('slow'));

    document.getElementById('btn-reset').addEventListener('click', () => {
      state.positions.start = {};
      state.positions.corner4 = {};
      state.fastFinishMap = {};
      state.selectedHorse = null;
      state.selectedFromBoard = null;
      updateGuideText();
      renderPool();
      renderBoard('start');
      renderBoard('corner4');
    });

    function applyPreset(type) {
      state.positions.start = {};
      state.positions.corner4 = {};
      const count = state.totalHorses;

      for (let i = 1; i <= count; i++) {
        const ratio = (i - 1) / (count - 1 || 1);
        let startX, cornerX;
        if (type === 'high') {
          startX = 90 - ratio * 75;
          cornerX = 85 - ratio * 70;
        } else {
          startX = 80 - ratio * 45;
          cornerX = 75 - ratio * 40;
        }
        const yPos = 20 + ((i * 3) % 65);

        state.positions.start[i] = { x: startX, y: yPos };
        state.positions.corner4[i] = { x: cornerX, y: yPos };
      }

      state.selectedHorse = null;
      state.selectedFromBoard = null;
      updateGuideText();
      renderPool();
      renderBoard('start');
      renderBoard('corner4');
    }

    window.addEventListener('DOMContentLoaded', initApp);
    initApp();
  </script>
</body>
</html>
